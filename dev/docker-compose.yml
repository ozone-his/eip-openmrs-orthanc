version: '3'
services:

  mysql:
    image: mysql:8.0
    container_name: ozone-eip-mysql
    environment:
      MYSQL_DATABASE: eip_client
      MYSQL_USER: eip
      MYSQL_PASSWORD: eip
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - eip_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ueip", "-peip"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc
    restart: unless-stopped
    ports:
      - "8042:8042"   # Web UI / REST API
      - "4242:4242"   # DICOM receiver
    environment:
      ORTHANC__NAME: "Orthanc"
      ORTHANC__REGISTERED_USERS: |
        {"orthanc":"orthanc"}
      ORTHANC__DICOM_AET: "ORTHANC"
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
    volumes:
      - orthanc-storage:/var/lib/orthanc/db

  eip-client:
    container_name: ozone-eip-client
    env_file:
      - .env
    image: mekomsolutions/eip-client
    ports:
      - "8085:8080"
    volumes:
      - ../target/eip-openmrs-orthanc-1.0.0-SNAPSHOT.jar:/eip-client/routes/eip-openmrs-orthanc-1.0.0-SNAPSHOT.jar
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure



volumes:
  eip_mysql_data:
  orthanc-storage: